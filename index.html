<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover,
             user-scalable=no"
>

<title>PenguinMod Gyro</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: black;
}

#project {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    border: 0;
}

#gyroUI {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    background: rgba(0, 0, 0, 0.4);

    z-index: 999999;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        Arial,
        sans-serif;
}

#gyroBox {
    width: min(340px, 82vw);

    padding: 25px;

    border-radius: 24px;

    background: rgba(28, 28, 30, 0.97);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5);

    text-align: center;
}

#gyroTitle {
    color: white;

    font-size: 24px;

    font-weight: 700;

    margin-bottom: 10px;
}

#gyroDescription {
    color: rgba(255,255,255,0.7);

    font-size: 14px;

    line-height: 20px;

    margin-bottom: 20px;
}

#enableGyro {
    width: 100%;

    padding: 15px;

    border: 0;

    border-radius: 15px;

    background: #5865F2;

    color: white;

    font-size: 17px;

    font-weight: 600;

    -webkit-appearance: none;

    touch-action: manipulation;
}

#gyroStatus {
    margin-top: 15px;

    color: rgba(255,255,255,0.7);

    font-size: 13px;
}

</style>

</head>

<body>

<!--
    YOUR PENGUINMOD PROJECT
-->
<iframe
    id="project"
    src="https://defnotsharkyy2026.github.io/boom/Project.html"
    allow="accelerometer; gyroscope; magnetometer"
></iframe>


<div id="gyroUI">

    <div id="gyroBox">

        <div id="gyroTitle">
            Gyroscope
        </div>

        <div id="gyroDescription">
            Allow motion sensors to use
            your iPhone's tilt controls.
        </div>

        <button id="enableGyro">
            Enable Gyroscope
        </button>

        <div id="gyroStatus">
            Waiting for permission...
        </div>

    </div>

</div>


<script>

const project =
    document.getElementById("project");

const ui =
    document.getElementById("gyroUI");

const button =
    document.getElementById("enableGyro");

const status =
    document.getElementById("gyroStatus");


let enabled = false;
let receiving = false;


/*
 * Send data into PenguinMod.
 */
function sendGyro(
    alpha,
    beta,
    gamma,
    absolute
) {

    receiving = true;

    project.contentWindow.postMessage(
        {
            type: "PENGUINMOD_GYRO",

            alpha: Number(alpha) || 0,

            beta: Number(beta) || 0,

            gamma: Number(gamma) || 0,

            absolute: !!absolute,

            enabled: true,

            receiving: true,

            permission: "granted"
        },

        "*"
    );
}


/*
 * iPhone orientation event.
 */
function orientationHandler(event) {

    sendGyro(
        event.alpha,
        event.beta,
        event.gamma,
        event.absolute
    );

}


/*
 * Start listening.
 */
function startGyroscope() {

    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );

    enabled = true;

    status.textContent =
        "Gyroscope enabled ✓";

    button.textContent =
        "Enabled ✓";

    button.disabled = true;

    setTimeout(() => {

        ui.style.display = "none";

    }, 700);

}


/*
 * Ask iPhone for permission.
 *
 * THIS CODE IS RUN BY THE TOP-LEVEL PAGE.
 */
async function requestGyroscopePermission() {

    try {

        if (!window.isSecureContext) {

            status.textContent =
                "ERROR: HTTPS is required.";

            return;

        }


        if (
            typeof DeviceOrientationEvent ===
            "undefined"
        ) {

            status.textContent =
                "ERROR: Device orientation unavailable.";

            return;

        }


        /*
         * iOS Safari
         */
        if (
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ) {

            status.textContent =
                "Requesting permission...";


            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if (permission !== "granted") {

                status.textContent =
                    "Permission: " + permission;

                return;

            }

        }


        startGyroscope();

    } catch (error) {

        console.error(
            "Gyroscope error:",
            error
        );

        status.textContent =
            "ERROR: " + error.message;

    }

}


/*
 * REAL iPhone tap.
 *
 * This is what fixes the permission problem.
 */
button.addEventListener(
    "click",
    requestGyroscopePermission
);


/*
 * Allow PenguinMod to request the UI.
 */
window.addEventListener(
    "message",
    event => {

        if (
            !event.data ||
            event.data.type !==
                "PENGUINMOD_GYRO_REQUEST"
        ) {
            return;
        }

        /*
         * We cannot automatically call the iOS
         * permission API here because this isn't
         * the original button gesture anymore.
         *
         * Instead, show our real button.
         */
        ui.style.display = "flex";

    }
);


/*
 * If the PenguinMod iframe reloads,
 * send its current sensor state again.
 */
project.addEventListener(
    "load",
    () => {

        if (!enabled) {
            return;
        }

        project.contentWindow.postMessage(
            {
                type: "PENGUINMOD_GYRO",

                alpha: 0,
                beta: 0,
                gamma: 0,

                absolute: false,

                enabled: true,

                receiving: receiving,

                permission: "granted"
            },

            "*"
        );

    }
);

</script>

</body>

</html>
